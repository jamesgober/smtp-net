name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Run every JS action on Node.js 24 ahead of GitHub's forced migration,
  # silencing "Node.js 20 actions are deprecated" runner warnings.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Test (default features)
        run: cargo test
      - name: Test (all features)
        run: cargo test --all-features
      - name: Test (no default features)
        run: cargo test --no-default-features
      - name: Build examples
        run: cargo build --examples --all-features
      - name: Doc (default features)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Doc (all features)
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  no-std:
    name: Bare metal (thumbv7em-none-eabi / ${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: thumbv7em-none-eabi
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: thumbv7em
      # The core (addresses, messages, the session) needs only alloc
      # (dev/PLAN.md NFR-10); a target without std proves it.
      - name: Build (no default features)
        run: cargo build --target thumbv7em-none-eabi --no-default-features
      - name: Clippy (no default features)
        run: cargo clippy --target thumbv7em-none-eabi --no-default-features -- -D warnings
      # SCRAM is pure Rust and needs no std (the caller supplies the nonce).
      - name: Build and clippy (scram)
        run: |
          cargo build --target thumbv7em-none-eabi --no-default-features --features scram
          cargo clippy --target thumbv7em-none-eabi --no-default-features --features scram -- -D warnings

  dependencies:
    name: No third-party runtime dependency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Only first-party crates in the normal dependency tree
        shell: bash
        run: |
          set -euo pipefail
          # NFR-11: smtp-net depends only on first-party crates; third-party
          # code arrives only through crypt-io (audited cryptography) and
          # tls-net (rustls), the two accepted exceptions.
          direct=$(cargo tree -e normal --all-features --depth 1 --prefix none | tail -n +2 | sort -u)
          echo "$direct"
          if printf '%s\n' "$direct" | grep -Ev '^(parse-net|mod-rand|net-io|crypt-io|tls-net) ' | grep -q .; then
            echo "a direct runtime dependency outside the first-party list"
            exit 1
          fi
          # The no_std core: first-party plus crypt-io's zeroize and subtle.
          core=$(cargo tree -e normal --no-default-features --prefix none | sort -u)
          echo "$core"
          if printf '%s\n' "$core" | grep -Ev '^(smtp-net|parse-net|crypt-io|zeroize|subtle) ' | grep -q .; then
            echo "the no_std core pulled something unexpected"
            exit 1
          fi

  fuzz:
    name: Fuzz targets build and smoke run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The prebuilt cargo-fuzz is a musl binary and would default to the
      # musl target, where the sanitizer cannot link: name the target.
      - name: Build every target
        run: cargo fuzz build --target x86_64-unknown-linux-gnu
      - name: Thirty seconds per target
        run: |
          for t in $(cargo fuzz list); do
            cargo fuzz run --target x86_64-unknown-linux-gnu "$t" -- -max_total_time=30 -rss_limit_mb=2048
          done

  loom:
    name: Loom models (HourlyLimit, pool slots)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: loom
      - name: Every loom model
        env:
          RUSTFLAGS: "-D warnings --cfg smtp_net_loom"
        run: cargo test --release --lib loom

  benches:
    # The benchmark crate (benches/) is its own workspace with criterion as
    # its dependency; building it keeps it compiling without adding anything
    # to smtp-net's own builds.
    name: Benchmarks build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benches
      - name: Build the benchmarks
        working-directory: benches
        run: cargo bench --no-run

  interop:
    # Real mail servers (dev/PLAN.md 12.8): Mailpit as a container, Exim (the
    # MTA family cPanel runs) from the distribution, both on loopback.
    name: Interop (Mailpit, Exim)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Exim
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q exim4-daemon-light
          sudo systemctl restart exim4 || sudo service exim4 restart
      - name: Send every shape to Mailpit
        run: SMTP_NET_INTEROP_PORT=1025 cargo test --test interop -- --nocapture --test-threads=1 | tee mailpit.log
      - name: Mailpit received every message
        run: |
          curl -fsS http://127.0.0.1:8025/api/v1/messages > mailpit.json
          for id in $(grep -o 'SENT [^ ]*' mailpit.log | cut -d' ' -f2); do
            grep -q "$id" mailpit.json || { echo "missing $id"; cat mailpit.json; exit 1; }
          done
      - name: Start Mailpit with TLS (STARTTLS and implicit TLS, the fixture certificate)
        run: |
          for mode in starttls:1587 tls:1465; do
            name=${mode%%:*}; port=${mode##*:}
            docker run -d --name "mp-$name" -p "$port:1025" -v "$PWD/tests/fixtures:/certs:ro" axllent/mailpit               --smtp-tls-cert /certs/localhost.pem --smtp-tls-key /certs/localhost.key               --smtp-require-"$name" --smtp-auth-accept-any
          done
          sleep 3
      - name: Send over real TLS with verification
        run: |
          SMTP_NET_INTEROP_STARTTLS_PORT=1587 SMTP_NET_INTEROP_IMPLICIT_PORT=1465             cargo test --test interop test_interop_tls -- --nocapture | tee tls.log
          test "$(grep -c '^SENT ' tls.log)" -eq 2
      - name: Send every shape to Exim
        run: SMTP_NET_INTEROP_PORT=25 SMTP_NET_INTEROP_TO="$USER@localhost" cargo test --test interop -- --nocapture --test-threads=1 | tee exim.log
      - name: Exim delivered every message
        run: |
          # Exim queues some messages of a busy connection for its next queue
          # run; force one, and wait up to 30 s for deliveries still in
          # progress (a locked spool file is being delivered by another process).
          ids=$(grep -o 'SENT [^ ]*' exim.log | cut -d' ' -f2)
          for attempt in $(seq 1 15); do
            sudo exim4 -qff
            sleep 2
            sudo cat /var/mail/"$USER" > exim.mbox || true
            missing=""
            for id in $ids; do grep -q "$id" exim.mbox || missing="$missing $id"; done
            [ -z "$missing" ] && exit 0
          done
          echo "missing:$missing"
          sudo tail -n 50 /var/log/exim4/mainlog
          exit 1

  dkim:
    # An independent verifier (dkimpy) checks the signatures, so no
    # reference implementation enters the crate's dependency graph.
    name: DKIM (independent verifier)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dkimpy
        run: python -m pip install dkimpy pynacl
      - name: Write the signed corpus
        run: SMTP_NET_DKIM_CORPUS="$RUNNER_TEMP/dkim" cargo test --features testing,dkim --test dkim
      - name: Verify with dkimpy
        run: python -I .github/scripts/dkim_verify.py "$RUNNER_TEMP/dkim"

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package
        run: cargo package

  security:
    name: Security (audit + deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Audit
        run: cargo audit
      - name: Deny
        run: cargo deny check
