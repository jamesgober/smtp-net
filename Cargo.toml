# =============================================================================
#  R E P S   ·   smtp-net
# =============================================================================
[package]
name    = "smtp-net"
version = "0.8.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# The fuzz and benchmark crates are their own workspaces, never packaged.
exclude = ["/fuzz", "/benches"]

# Description
description = "SMTP client for Rust: message submission over STARTTLS or implicit TLS, authentication, pipelining, MIME message building, DKIM signing, and a sans-IO core."

# Keywords (5 max)
keywords = ["smtp", "email", "mail", "dkim", "mime"]

# Categories
categories = ["email", "network-programming"]

# Links
homepage      = "https://github.com/jamesgober/smtp-net"
repository    = "https://github.com/jamesgober/smtp-net"
documentation = "https://docs.rs/smtp-net"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "smtp_net"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std", "client", "tls"]
# OS random source (mod-rand), the system clock for Date, std::error::Error,
# IoSink. Without it the core (addresses, messages, the session) is no_std
# with alloc; randomness and time are passed in.
std = ["dep:mod-rand"]
# The blocking driver over net-io: send, send_local, Client.
client = ["std", "dep:net-io"]
# STARTTLS and implicit TLS with tls-net (rustls, verification always on) as
# the default engine (dev/PLAN.md D-025, D-051).
tls = ["client", "dep:tls-net"]
# ScriptedServer, TestServer, Fault: test support for this crate's users.
testing = ["client"]
# DKIM signing: Ed25519-SHA256 and RSA-SHA256 through crypt-io (AWS-LC
# behind it, the same backend tls-net uses). The canonicalizers are always
# built; only the keys and the signer need this feature.
# SCRAM-SHA-256 (RFC 7677): PBKDF2, HMAC-SHA-256, and SHA-256 through
# crypt-io (pure Rust). First in the default mechanism list when on.
scram = ["crypt-io/hash-sha2", "crypt-io/mac-hmac", "crypt-io/kdf-pbkdf2"]
dkim = ["std", "crypt-io/sign-ed25519", "crypt-io/sign-rsa", "crypt-io/hash-sha2"]


# DEPENDENCIES
# #################################
[dependencies]
# RFC 5322 addresses, header folding, RFC 2047 words, RFC 2231 parameters,
# Message-ID, and dates (dev/PLAN.md D-014). First party, no dependencies.
parse-net = { version = "0.9.2", default-features = false, features = ["alloc"] }
# OS CSPRNG for Message-ID and MIME boundaries. First party, no dependencies.
mod-rand = { version = "1", default-features = false, features = ["tier3"], optional = true }
# Wipes credentials on drop (Zeroizing); with `dkim`, Ed25519 and RSA
# signing and SHA-256. The audited-cryptography exception (dev/PLAN.md D-050).
crypt-io = { version = "1.3", default-features = false, features = ["zeroize"] }
# TLS: rustls through tls-net (the accepted exception), Mozilla roots,
# aws-lc-rs provider, the net-io seam.
tls-net = { version = "0.9.1", default-features = false, features = ["aws-lc", "webpki-roots", "net-io"], optional = true }
# Outbound TCP with deadlines, and the sans-IO TLS seam. First party, no dependencies.
net-io = { version = "0.7.2", default-features = false, optional = true }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
# The tls_real test builds net-io TLS sessions for the test server.
net-io = { version = "0.7.2", default-features = false }
tls-net = { version = "0.9.1", default-features = false, features = ["aws-lc", "webpki-roots", "net-io"] }
# Property tests only; never a runtime dependency.
proptest = { version = "1", default-features = false, features = ["std"] }


[[example]]
name = "send_local"
required-features = ["client"]

[[example]]
name = "sans_io_driver"
required-features = ["testing"]

[[example]]
name = "prepared_job"
required-features = ["testing"]

[[example]]
name = "dkim_dns_record"
required-features = ["dkim"]

[[example]]
name = "send_with_dkim"
required-features = ["testing", "dkim"]

[[test]]
name = "interop"
required-features = ["client"]

[[test]]
name = "transcripts"
required-features = ["testing"]

[[test]]
name = "driver"
required-features = ["testing"]

[[test]]
name = "extended"
required-features = ["testing"]

[[test]]
name = "auth"
required-features = ["testing"]

[[test]]
name = "pool"
required-features = ["testing"]

[[test]]
name = "crosstalk"
required-features = ["testing"]

[[test]]
name = "dkim"
required-features = ["testing", "dkim"]

[[test]]
name = "tls_real"
required-features = ["testing", "tls"]

[[test]]
name = "threats"
required-features = ["testing"]

[[test]]
name = "soak"
required-features = ["testing"]


# loom models for HourlyLimit: RUSTFLAGS="--cfg smtp_net_loom" cargo test --release --lib gate
[target.'cfg(smtp_net_loom)'.dev-dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(smtp_net_loom)'] }


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
